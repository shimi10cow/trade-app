<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EA 成績レポート</title>
<style>
:root{--bg:#0b1220;--card:#111c31;--line:#1e293b;--line2:#334155;--fg:#e2e8f0;--mut:#94a3b8;--dim:#64748b;--up:#4ade80;--dn:#f87171;--warn:#fbbf24;--acc:#22d3ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0b1220f0;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media(max-width:700px){header#top{position:static}}
h1{font-size:16px;margin:0 12px 0 0}main{padding:12px 16px 60px;max-width:1500px;margin:0 auto}
button.t{background:#172033;color:var(--fg);border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
button.t.on{background:#0e7490;border-color:#22d3ee}button.t:disabled{opacity:.4}.sec{display:none}.sec.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.kv{background:#0f172a;border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.kv .k{font-size:11px;color:var(--mut)}.kv .v{font-size:15px;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card);z-index:1}td.l,th.l{text-align:left}.scroll{overflow:auto;max-height:70vh}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.dim{color:var(--dim)}.warn{color:var(--warn)}
.note{font-size:11px;color:var(--dim);line-height:1.6}tr.click{cursor:pointer}tr.click:hover{background:#16233b}tr.sel{background:#1b2c4a}tr.exr{opacity:.45}
/* 2026-11-22 (user): app-like. PC: the list on the left, the chart on the right and it stays in view; phone: the chart stays at the top,
   the list scrolls under it, ◀ ▶ step through the list, the marks fold away; the main tabs are a bar at the bottom. */
#tv{display:grid;grid-template-columns:340px minmax(0,1fr);gap:10px;align-items:start}#tv>*{min-width:0}
#tlistcard{order:1;position:sticky;top:var(--hdr,96px)}#tlistcard .scroll{max-height:calc(100vh - var(--hdr,96px) - 60px)}#tchart{order:2}#chartcard{position:sticky;top:var(--hdr,96px);z-index:3}
@media(max-width:1000px){#tv{grid-template-columns:minmax(0,1fr)}#tchart{order:1}#tlistcard{order:2;position:static}#tlistcard .scroll{max-height:none}
  #chartcard{top:0;margin-top:0;border-radius:0 0 12px 12px}
  #tfbtn,#drawbtn{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:4px 0}#tfbtn::-webkit-scrollbar,#drawbtn::-webkit-scrollbar{display:none}
  #tfbtn .t,#drawbtn .t,#tfbtn label{flex:none;padding:4px 8px;white-space:nowrap}}
#nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#nav .nb{background:#172033;color:var(--fg);border:1px solid var(--line2);border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer}
#nav .nb.on{background:#0e7490;border-color:#22d3ee}#sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}#sub:empty{display:none}
@media(max-width:700px){#tabs{background:var(--bg);box-shadow:0 -6px 16px #0008;position:fixed;top:auto!important;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));flex-direction:column;align-items:stretch}
  #nav{flex-wrap:nowrap;gap:2px}#nav .nb{flex:1;padding:6px 2px;font-size:11px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--mut)}
  #nav .nb.on{background:none;color:var(--acc)}#nav .nb i{font-style:normal;font-size:18px}#sub{order:-1;flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 6px;margin:0}#sub .t{flex:none}
  main{padding-bottom:110px}}
canvas{width:100%;display:block;background:#0f172a;border-radius:8px;touch-action:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}.badge{font-size:10px;padding:1px 6px;border-radius:4px;background:#1e293b;color:var(--mut)}
.badge.miss{background:#3b2a0a;color:#fbbf24}
select,input,textarea{background:#0f172a;color:var(--fg);border:1px solid var(--line2);border-radius:6px;padding:4px 6px;font-size:12px;font-family:inherit}
.pill{border-radius:999px;padding:4px 10px;font-size:12px;border:1px solid var(--line2);background:#172033;color:var(--fg);cursor:pointer}.pill.on{border-color:#22d3ee;background:#0e3a46}
.vb{border-radius:8px;padding:6px 4px;font-size:12px;border:1px solid var(--line2);background:#172033;color:var(--fg);cursor:pointer}.vb.on{font-weight:700}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:3px}
</style></head><body>
<header id="top"><h1>EA 成績レポート</h1><span id="made" class="mut"></span>
  <span style="flex:1"></span><span id="accbtn"></span><label class="mut" style="font-size:12px"><input type="checkbox" id="showex"> 外したトレードも数える</label></header>
<header style="top:45px" id="tabs"></header>
<script>(function () { const fit = () => { const h = document.getElementById('top'), t = document.getElementById('tabs'); if (h && t && innerWidth > 700) { t.style.top = h.offsetHeight + 'px'; document.documentElement.style.setProperty('--hdr', (h.offsetHeight + t.offsetHeight + 6) + 'px'); } }; window.fitHdr = fit; addEventListener('resize', fit); addEventListener('load', fit); setTimeout(fit, 0); })();</script>
<main>
  <section class="sec" id="s-sum"></section>
  <section class="sec" id="s-per"></section>
  <section class="sec" id="s-mon"></section>
  <section class="sec" id="s-ea"></section>
  <section class="sec" id="s-bt"></section>
  <section class="sec" id="s-mc"></section>
  <section class="sec" id="s-ex"></section>
  <section class="sec" id="s-hy"></section>
  <section class="sec" id="s-mn"></section>
  <section class="sec" id="s-tr"><div id="tv"><div id="tchart"><div class="card" id="chartcard" style="padding:8px">
      <div class="chips" id="tfbtn"></div><div class="chips" id="drawbtn"></div><canvas id="cv" height="560"></canvas></div>
      <div class="card" style="padding:8px"><div id="tinfo"></div><details id="tmarkbox" open><summary class="mut" style="cursor:pointer;font-size:12px">判定・メモ</summary><div id="tmark"></div></details>
      <details><summary class="dim" style="cursor:pointer;font-size:11px;margin-top:6px">チャートの見方</summary><div class="note">ローソク：白抜き＝陽線、灰色＝陰線。MA：<span class="sw" style="background:#ef4444"></span>20 <span class="sw" style="background:#22c55e"></span>75 <span class="sw" style="background:#f472b6"></span>200。
        ▲▼＝入り、✕＝決済、灰色の○＝バックテストの入り。横線：白＝入り、赤の点線＝最初の損切り、緑＝利確、黄＝決済。
        引いた線・ボックスの色＝引いた足：<span class="sw" style="background:#60a5fa"></span>日足 <span class="sw" style="background:#fb923c"></span>H4 <span class="sw" style="background:#a78bfa"></span>H1 <span class="sw" style="background:#facc15"></span>M15（どの足でも見える）。
        ✋ 動かす：何もない所をドラッグでスクロール、線をドラッグで移動、線を押すと ✕（削除）。ホイール・2 本指で拡大縮小。道具は 1 回使うと ✋ に戻る。トレンドラインは右に伸びる。</div></details></div></div>
    <div class="card" id="tlistcard" style="padding:8px"><div class="chips" id="tflt"></div><div class="scroll"><table id="tlist"></table></div></div></div></section>
</main>
<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const S = {acc: D.accs[0], tab: 's-sum', tf: 'H1', sel: null, pick: -1, pickAt: null, fam: '', res: '', sym: '', eaf: '', kind: '', mode: 'pan', draft: null, mc: {src: 'live', cap: 300000, risk: 1, years: 1, ruin: 30, sims: 2000}};
const f2 = (v, d = 2) => v == null || isNaN(v) ? '—' : Number(v).toFixed(d), sg = v => v == null || isNaN(v) ? '—' : (v > 0 ? '+' : '') + Number(v).toFixed(2);
const yen = v => v == null || isNaN(v) ? '—' : (v < 0 ? '-' : '+') + '¥' + Math.round(Math.abs(v)).toLocaleString('ja-JP');
const tstr = m => { if (m == null) return '—'; const d = new Date(m * 60000); return d.toISOString().slice(0, 16).replace('T', ' '); };
const cls = v => v > 0 ? 'up' : v < 0 ? 'dn' : '';
const px = (t, v) => v == null || isNaN(v) || !v ? '—' : Number(v).toFixed((D.charts[t.sym] || {}).dig ?? 5);
const famCode = f => (D.fams[f] || {}).code || (f === 'OLD' ? '旧 EA' : f);
const VERD = [['ok', 'OK', '#4ade80'], ['ng', '入らない方がいい', '#f87171'], ['maybe', '迷う', '#fbbf24']];
const TAGS = ['伸びすぎ', 'レンジの中', '上位足が逆', '指標の前後', '損切りが遠い', 'その他'];
const XVERD = [['good', '良い決済', '#4ade80'], ['early', '早すぎた', '#fbbf24'], ['late', '遅すぎた', '#fb923c'], ['tight', '損切りが浅い', '#f87171'], ['wide', '損切りが深い', '#c084fc']];
const XTAGS = ['M15 の押し安値割れ', 'H1 の押し安値割れ', 'H4 の押し安値割れ', '抵抗帯の手前', '前の高値・安値', 'H1 MA 割れ', 'ダウの転換', 'ライン割れ', 'その他'];
const TFC = {D1: '#60a5fa', H4: '#fb923c', H1: '#a78bfa', M15: '#facc15'}, TFN = {D1: '日足', H4: 'H4', H1: 'H1', M15: 'M15'};
// ------------------------------------------------------------ data per account
D.btl.forEach(b => { b.kind = 'B'; b.st = b.open ? 'OPEN' : 'CLOSED'; b.id = b.ea + '|' + tstr(b.et) + '|' + b.side; Object.assign(b, {v: '', tags: '', cm: '', xv: '', xtags: '', lines: []}, D.repmarks[b.id] || {}); });
D.trades.forEach(t => t.kind = 'L');
// all-pairs charts (2026-11-22): one object per pair; its lines = the trader's saved lines + the EA's H4 lines (gateway / fortress / band)
// that the trader has not touched. EA lines the trader moved or deleted are saved too (src 'ea', moved / del), deleted lines are kept with
// the time they were deleted, so later analysis can see what was changed.
(D.pairs || []).forEach(p => { p.kind = 'P'; p.id = 'PAIR|' + p.sym; const rm = D.repmarks[p.id] || {}; p.cm = rm.cm || ''; p.flag = rm.tags || '';
  const saved = (p.lines || []).slice(), have = new Set(saved.filter(l => l.eid).map(l => l.eid));
  ((D.pcharts[p.sym] || {}).ea || []).forEach(e => { const eid = [e.kind, e.tf || 'H4', e.side, e.t, e.p, e.t2 || '', e.p2 || ''].join('|'); if (have.has(eid)) return;
    if (e.type === 't') saved.push({type: 't', src: 'ea', eid, kind: e.kind, side: e.side, tf: e.tf, t1: e.t, p1: e.p, t2: e.t2, p2: e.p2});
    else saved.push({type: 'ea', src: 'ea', eid, kind: e.kind, side: e.side, t1: e.t, p1: e.p, tf: e.tf || 'H4'}); });
  p.lines = saved; });
const live = ls => (ls || []).filter(l => !l.del);
const nowJ = () => { const d = new Date(Date.now() + 9 * 3600e3); return d.toISOString().slice(0, 16).replace('T', ' '); };
function trades(all) { return D.trades.filter(t => t.acc === S.acc && (all || $('#showex').checked || !t.ex)); }
const closed = () => trades().filter(t => t.st === 'CLOSED' && t.R != null);
function accBT() {   // the period backtest for this account: EAs on now + EAs that traded here
  const keys = new Set((D.on[S.acc] || []).concat(trades(true).map(t => t.ea))), used = new Set(trades(true).map(t => t.btj).filter(j => j >= 0));
  const all = D.btl.filter(b => keys.has(b.ea)); return {all, missed: all.filter(b => !used.has(b.j)), used};
}
function stats(g) {
  const R = g.map(t => t.R), n = R.length, w = R.filter(r => r > 0).length, sum = R.reduce((a, b) => a + b, 0);
  const pos = R.filter(r => r > 0).reduce((a, b) => a + b, 0), neg = -R.filter(r => r < 0).reduce((a, b) => a + b, 0);
  let c = 0, pk = 0, dd = 0, ls = 0, mls = 0; R.forEach(r => { c += r; pk = Math.max(pk, c); dd = Math.max(dd, pk - c); ls = r < 0 ? ls + 1 : 0; mls = Math.max(mls, ls); });
  const P = g.map(t => t.pf || 0).reduce((a, b) => a + b, 0);
  return {n, w, sum, avg: n ? sum / n : null, pf: neg ? pos / neg : null, dd, mls, P, best: n ? Math.max(...R) : null, worst: n ? Math.min(...R) : null};
}
function judge(n, avg, exp, sd) {
  if (!n || avg == null || exp == null || !sd) return null;
  const z = (avg - exp) / (sd / Math.sqrt(n));
  return z >= -1 ? {m: '○', c: 'up', z} : z >= -2 ? {m: '△', c: 'warn', z} : {m: '×', c: 'dn', z};
}
const mk = j => j ? `<b class="${j.c}">${j.m}</b> <span class="dim">${j.z.toFixed(1)}</span>` : '<span class="dim">—</span>';
const kv = (k, v, c = '') => `<div class="kv"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
// ------------------------------------------------------------ header
function header() {
  $('#made').textContent = '作成 ' + D.made + (D.btDone ? '' : '（バックテストなし）');
  $('#accbtn').innerHTML = ['demo', 'live'].map(a => `<button class="t ${S.acc === a ? 'on' : ''}" onclick="S.acc='${a}';S.sel=null;draw()">${a === 'live' ? 'リアル' : 'デモ'}口座</button>`).join(' ');
  const has = id => (id !== 's-px' || (D.pairs || []).length) && (id !== 's-mn' || (D.manual || []).length);
  const MAIN = [['s-px', '📈', 'チャート分析'], ['s-tr', '🧾', 'トレード'], ['s-sum', '📊', 'まとめ'], ['s-mn', '✍️', '裁量']].filter(([id]) => has(id));
  const SUB = [['s-per', '期間のバックテスト'], ['s-mon', '月ごと'], ['s-ea', 'EA ごと'], ['s-bt', '突き合わせ'], ['s-mc', 'モンテカルロ'], ['s-hy', '半年見直し'], ['s-ex', '約定・その他']];
  const inSub = SUB.some(([id]) => id === S.tab); if (inSub) S.more = true;
  $('#tabs').innerHTML = `<div id="nav">${MAIN.map(([id, ic, l]) => `<button class="nb ${S.tab === id ? 'on' : ''}" onclick="S.more=false;goTab('${id}')"><i>${ic}</i>${l}</button>`).join('')}
    <button class="nb ${inSub ? 'on' : ''}" onclick="S.more=!S.more;header()"><i>☰</i>その他${S.more ? ' ▴' : ' ▾'}</button></div>
    <div id="sub">${S.more ? SUB.map(([id, l]) => `<button class="t ${S.tab === id ? 'on' : ''}" onclick="goTab('${id}')">${l}</button>`).join('') : ''}</div>`;
  document.querySelectorAll('.sec').forEach(s => s.classList.toggle('on', s.id === (S.tab === 's-px' ? 's-tr' : S.tab)));
  if (window.fitHdr) setTimeout(fitHdr, 0);
}
// ------------------------------------------------------------ small charts
function prep(id, h) { const cv = document.getElementById(id); if (!cv) return null; const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = h; cv.width = W * dpr; cv.height = H * dpr; const x = cv.getContext('2d'); x.scale(dpr, dpr); x.clearRect(0, 0, W, H); return {x, W, H}; }
function lineChart(id, series, opt = {}) {
  const c = prep(id, opt.h || 260); if (!c) return; const {x, W, H} = c;
  const all = series.flatMap(s => s.pts.map(p => p[1])).concat(series.flatMap(s => (s.band || []).flatMap(b => [b[1], b[2]]))).filter(v => v != null && !isNaN(v));
  const n = Math.max(1, ...series.map(s => s.pts.length)); if (!all.length) { x.fillStyle = '#64748b'; x.fillText('データなし', 10, 20); return; }
  let lo = opt.zero === false ? Math.min(...all) : Math.min(0, ...all), hi = opt.zero === false ? Math.max(...all) : Math.max(0, ...all); if (hi === lo) hi = lo + 1; const pad = 44;
  const X = i => pad + i / Math.max(1, n - 1) * (W - pad - 8), Y = v => 8 + (hi - v) / (hi - lo) * (H - 28);
  const fmt = v => Math.abs(v) >= 10000 ? Math.round(v).toLocaleString('ja-JP') : v.toFixed(1);
  x.strokeStyle = '#334155'; if (lo < 0 && hi > 0) { x.beginPath(); x.moveTo(pad, Y(0)); x.lineTo(W - 8, Y(0)); x.stroke(); }
  x.fillStyle = '#64748b'; x.font = '10px sans-serif'; x.fillText(fmt(hi), 2, 14); x.fillText(fmt(lo), 2, H - 18);
  series.forEach(s => {
    if ((s.band || []).length) { x.fillStyle = s.bandColor || 'rgba(148,163,184,.12)'; x.beginPath(); s.band.forEach((b, i) => i ? x.lineTo(X(i), Y(b[2])) : x.moveTo(X(i), Y(b[2])));
      s.band.slice().reverse().forEach((b, k) => x.lineTo(X(s.band.length - 1 - k), Y(b[1]))); x.closePath(); x.fill(); }
    if (!s.color) return; x.strokeStyle = s.color; x.lineWidth = s.w || 1.5; x.setLineDash(s.dash || []); x.beginPath();
    s.pts.forEach((p, i) => p[1] == null ? 0 : (i ? x.lineTo(X(i), Y(p[1])) : x.moveTo(X(i), Y(p[1])))); x.stroke(); x.setLineDash([]); x.lineWidth = 1;
  });
  if (opt.labels) { x.fillStyle = '#64748b'; const L = opt.labels; [0, Math.floor(L.length / 2), L.length - 1].forEach(i => L[i] && x.fillText(L[i], Math.min(W - 70, X(i)), H - 4)); }
}
function timeChart(id, series, h = 280) {   // x = time (minutes), y = value; steps of cumulative R
  const c = prep(id, h); if (!c) return; const {x, W, H} = c;
  const pts = series.flatMap(s => s.pts); if (!pts.length) { x.fillStyle = '#64748b'; x.fillText('データなし', 10, 20); return; }
  const t0 = Math.min(...pts.map(p => p[0])), t1 = Math.max(...pts.map(p => p[0])) || t0 + 1; let lo = Math.min(0, ...pts.map(p => p[1])), hi = Math.max(0, ...pts.map(p => p[1])); if (hi === lo) hi = lo + 1;
  const pad = 40, X = t => pad + (t - t0) / Math.max(1, t1 - t0) * (W - pad - 8), Y = v => 8 + (hi - v) / (hi - lo) * (H - 28);
  x.strokeStyle = '#334155'; x.beginPath(); x.moveTo(pad, Y(0)); x.lineTo(W - 8, Y(0)); x.stroke(); x.fillStyle = '#64748b'; x.font = '10px sans-serif';
  x.fillText(hi.toFixed(1), 2, 14); x.fillText(lo.toFixed(1), 2, H - 18); [t0, (t0 + t1) / 2, t1].forEach(t => x.fillText(tstr(t).slice(0, 10), Math.min(W - 70, X(t)), H - 4));
  series.forEach(s => { x.strokeStyle = s.color; x.lineWidth = s.w || 1.5; x.setLineDash(s.dash || []); x.beginPath(); let v = 0; x.moveTo(X(t0), Y(0));
    s.pts.forEach(p => { x.lineTo(X(p[0]), Y(v)); v = p[1]; x.lineTo(X(p[0]), Y(v)); }); x.lineTo(X(t1), Y(v)); x.stroke(); x.setLineDash([]); x.lineWidth = 1; });
}
const cumPts = g => { let c = 0; return g.filter(t => t.R != null && t.xt != null).sort((a, b) => a.xt - b.xt).map(t => [t.xt, c += t.R]); };
// ------------------------------------------------------------ まとめ
function sumSec() {
  const g = closed().sort((a, b) => a.xt - b.xt), s = stats(g), op = trades().filter(t => t.st === 'OPEN').length;
  const first = g.length ? tstr(g[0].et).slice(0, 10) : '—', last = g.length ? tstr(g[g.length - 1].xt).slice(0, 10) : '—';
  let ex = 0, v2 = 0; const cum = [], band = [], band1 = [], expl = [], labels = [];
  g.forEach(t => { const e = D.exp[t.ea] || [0, 2]; ex += e[0]; v2 += e[1] * e[1]; const sd = Math.sqrt(v2); cum.push([0, (cum.length ? cum[cum.length - 1][1] : 0) + t.R]); expl.push([0, ex]);
    band.push([0, ex - 2 * sd, ex + 2 * sd]); band1.push([0, ex - sd, ex + sd]); labels.push(tstr(t.xt).slice(0, 10)); });
  const z = g.length ? (s.sum - ex) / Math.sqrt(v2 || 1) : null, j = judge(g.length ? 1 : 0, z, 0, 1), dl = D.daily.filter(d => d.acc === S.acc);
  $('#s-sum').innerHTML = `<div class="card"><div class="grid">

function hySec() {
  const g = closed(), byK = {}; g.forEach(t => (byK[t.ea] = byK[t.ea] || []).push(t));
  const bk = {}; if (D.btDone) accBT().all.filter(b => !b.open && b.R != null).forEach(b => (bk[b.ea] = bk[b.ea] || []).push(b));
  const first = g.length ? Math.min(...g.map(t => t.et).filter(v => v != null)) : null, now = Date.now() / 60000 + 540;
  const six = now - 182 * 1440, mons = first ? (now - first) / 1440 / 30.4 : 0;
  const next = first ? (() => { let m = first; while (m <= now) m += 182 * 1440; return tstr(m).slice(0, 10); })() : '—';
  const keys = [...new Set(Object.keys(byK).concat(Object.keys(bk)).concat(D.on[S.acc] || []))];
  const rows = keys.map(k => {
    const a = byK[k] || [], s = stats(a), s6 = stats(a.filter(t => t.et >= six)), e = D.exp[k], pb = stats(bk[k] || []), j = e ? judge(s.n, s.avg, e[0], e[1]) : null;
    const jb = e && pb.n ? judge(pb.n, pb.avg, e[0], e[1]) : null, gap = s.n && pb.n ? s.avg - pb.avg : null;
    let v, c;
    if (s.n < 20) { v = '回数が少ない（まだ判断しない）'; c = 'dim'; }
    else if (j && j.z >= -1) { v = 'そのまま'; c = 'up'; }
    else if (gap != null && gap < -0.3 && (!jb || jb.z >= -1)) { v = '実行のずれ（滑り・入り損ね・決済）を確認'; c = 'warn'; }
    else if (jb && jb.z < -1) { v = '相場が合わない時期（BT も弱い）→ 様子見'; c = 'warn'; }
    else if (j && j.z >= -2) { v = '様子見'; c = 'warn'; }
    else { v = '見直し候補'; c = 'dn'; }
    return {k, s, s6, e, pb, j, gap, v, c, z: j ? j.z : 99};
  }).sort((a, b) => a.z - b.z);
  const tr = r => `<tr class="click" onclick="S.fam='';S.sym='';S.eaf='${r.k}';S.tab='s-tr';draw()"><td class="l">${esc(r.k)}${(D.on[S.acc] || []).includes(r.k) ? '' : ' <span class="badge">オフ</span>'}</td>

    <td class="${cls(r.gap)}">${r.gap == null ? '—' : sg(r.gap)}</td><td class="l ${r.c}" style="font-size:12px">${r.v}</td></tr>`;
  const cnt = c => rows.filter(r => r.c === c).length;
  $('#s-hy').innerHTML = `<div class="card"><b>半年ごとの全体見直し</b>
    <div class="grid" style="margin-top:6px">${kv('動かした期間', first ? mons.toFixed(1) + ' か月' : '—')}${kv('次の見直し', next)}${kv('そのまま', cnt('up'), 'up')}${kv('様子見・確認', cnt('warn'), 'warn')}${kv('見直し候補', cnt('dn'), 'dn')}</div>
    <div class="note" style="margin-top:6px">決まり（11/18）：半年では良し悪しを決めきれないので、回数 20 回未満は判断しない。z ＝（本番の平均 R − 長期 BT の平均）÷ ばらつき。−1 より上は誤差の範囲。
      「実行のずれ」＝ 同じ期間の BT は普通なのに本番だけ悪い（滑り・入り損ね・決済のずれを「突き合わせ」で見る）。「相場が合わない時期」＝ 同じ期間の BT も同じように悪い（EA のせいではなく時期）。</div></div>
    <div class="card"><div class="scroll"><table><tr><th class="l">EA</th><th>回数</th><th>平均R</th><th>長期BT</th><th>判定(z)</th><th>直近6か月</th><th>6か月 平均R</th><th>期間BT 回数</th><th>期間BT 平均R</th><th>本番−BT</th><th class="l">見立て</th></tr>

const objDraftBase = d => { const t = objOf(d.key) || {}; return {v: t.v || '', flag: t.flag || '', tags: (t.tags || '').split(',').filter(Boolean), cm: t.cm || '', xv: t.xv || '', xtags: (t.xtags || '').split(',').filter(Boolean), lines: t.lines || []}; };
