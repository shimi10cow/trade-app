<title>EURUSD ダウ環境認識</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: toolbar on top, full-width chart, event log below. Chart-desk look, quiet chrome. */
:root{
  --bg:#f6f7f9;--panel:#ffffff;--fg:#1b2230;--muted:#667085;--line:#d9dee7;
  --up:#1f8a4c;--down:#c8372d;--prot-up:#1f8a4c;--prot-down:#c8372d;--accent:#2457c5;--piv:#d97706;--prov:#7c4dff;--w:#0e7490;
  --font:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151c;--panel:#171c25;--fg:#e4e8ef;--muted:#8b95a7;--line:#2a3140;
  --up:#3fbf75;--down:#ef5b4f;--prot-up:#3fbf75;--prot-down:#ef5b4f;--accent:#6c9cff;--piv:#f2a33a;--prov:#b39dff;--w:#3ec4d8;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c;--panel:#171c25;--fg:#e4e8ef;--muted:#8b95a7;--line:#2a3140;
  --up:#3fbf75;--down:#ef5b4f;--prot-up:#3fbf75;--prot-down:#ef5b4f;--accent:#6c9cff;--piv:#f2a33a;--prov:#b39dff;--w:#3ec4d8;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px}
h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.02em}
.tfs{display:flex;gap:4px}
.tfs button{font:600 13px var(--mono);padding:5px 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;cursor:pointer}
.tfs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
label{font-size:13px;color:var(--muted);display:flex;gap:4px;align-items:center;cursor:pointer}
.state{font:13px var(--mono);padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.state b.up{color:var(--up)} .state b.down{color:var(--down)}
#chart{height:min(68vh,640px);min-height:360px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:8px 0 14px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
h2{font-size:14px;margin:0 0 6px}
.log{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font:12px var(--mono);font-variant-numeric:tabular-nums}
td,th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr[data-t]{cursor:pointer} tr[data-t]:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.up{color:var(--up)} .down{color:var(--down)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="bar">
  <h1>EURUSD ダウ環境認識</h1>
  <div class="tfs" id="tfs"></div>
  <label><input type="checkbox" id="optPiv" checked> 高値安値</label>
  <label><input type="checkbox" id="optProt" checked> 押し安値/戻り高値</label>
  <label><input type="checkbox" id="optProv" checked> 仮トレンド</label>
  <label><input type="checkbox" id="optW" checked> Wトップ/ボトム</label>
  <label><input type="checkbox" id="optBo"> ブレイク</label>
  <span class="state" id="state"></span>
</div>
<div id="chart"></div>
<div class="legend">
  <span><i style="background:var(--prot-up)"></i>押し安値（上昇中）</span>
  <span><i style="background:var(--prot-down)"></i>戻り高値（下降中）</span>
  <span>▼▲ HH/HL/LH/LL＝ダウの高値安値（ヒゲ位置、確定は後の足）</span>
  <span>■ 転換＝終値が押し安値/戻り高値を抜けた足</span>
  <span><i style="background:repeating-linear-gradient(90deg,var(--prov) 0 4px,transparent 4px 7px)"></i>仮トレンドの押し安値/戻り高値（点線）・● 仮転換</span>
  <span>W＝Wトップ/ボトムのネックライン(B)を終値で抜けた足</span>
</div>
<h2>イベント一覧（クリックでその日付へ移動）</h2>
<div class="log"><table><thead><tr><th>日時</th><th>内容</th><th>価格</th><th>基準の足</th></tr></thead><tbody id="log"></tbody></table></div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const DATA=/*DATA*/null;
const TFS=['W1','D1','H4','H1','M15'];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=t=>new Date(t*1000).toISOString().slice(0,16).replace('T',' ');
const NAMES={rev:'トレンド転換',bo:'高値/安値更新',breakout_protect:'押し安値/戻り高値 移動',late_protect:'遅れ確定で移動',
  reversal_protect:'転換後の起点を設定',reversal_protect_raw:'転換後の起点(仮:ヒゲ)',init_up:'初期化 上昇',init_down:'初期化 下降'};
let tf='D1',chart,cs,ps;
try{const s=localStorage.getItem('envtf');if(TFS.includes(s))tf=s}catch(e){}

function build(){
  const el=document.getElementById('chart');el.innerHTML='';
  const d=DATA[tf];
  chart=LightweightCharts.createChart(el,{autoSize:true,
    layout:{background:{color:css('--panel')},textColor:css('--muted'),fontFamily:css('--mono')},
    grid:{vertLines:{color:css('--line')},horzLines:{color:css('--line')}},
    rightPriceScale:{borderColor:css('--line')},timeScale:{borderColor:css('--line'),timeVisible:tf!=='D1'&&tf!=='W1'},
    crosshair:{mode:0}});
  cs=chart.addCandlestickSeries({upColor:'#ffffff00',borderUpColor:css('--fg'),wickUpColor:css('--fg'),
    downColor:css('--fg'),borderDownColor:css('--fg'),wickDownColor:css('--fg'),priceLineVisible:false});
  cs.setData(d.candles.map(c=>({time:c[0],open:c[1],high:c[2],low:c[3],close:c[4]})));
  ps=chart.addLineSeries({lineType:1,lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
  if(document.getElementById('optProt').checked)
    ps.setData(d.prot.map(p=>p[1]==null?{time:p[0]}:{time:p[0],value:p[1],color:p[2]==='up'?css('--prot-up'):css('--prot-down')}));
  const pv=chart.addLineSeries({lineType:1,lineWidth:2,lineStyle:2,color:css('--prov'),priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
  const showProv=document.getElementById('optProv').checked;
  if(showProv) pv.setData(d.pprot.map(p=>p[1]==null?{time:p[0]}:{time:p[0],value:p[1]}));
  const m=[];
  if(showProv) for(const e of d.pev) m.push({time:e[0],position:e[1]==='up'?'belowBar':'aboveBar',shape:'circle',color:css('--prov'),text:e[1]==='up'?'仮上昇':'仮下降'});
  if(document.getElementById('optW').checked) for(const w of d.wev) m.push({time:w[0],position:w[1]==='W_TOP'?'aboveBar':'belowBar',shape:w[1]==='W_TOP'?'arrowDown':'arrowUp',color:css('--w'),text:w[1]==='W_TOP'?'Wトップ':'Wボトム'});
  if(document.getElementById('optPiv').checked) for(const p of d.piv)
    m.push({time:p[0],position:p[1]==='hi'?'aboveBar':'belowBar',shape:p[1]==='hi'?'arrowDown':'arrowUp',color:css('--piv'),text:p[3]});
  for(const e of d.ev){
    if(e[1]==='rev')m.push({time:e[0],position:e[2]==='up'?'belowBar':'aboveBar',shape:'square',color:e[2]==='up'?css('--up'):css('--down'),text:e[2]==='up'?'上昇転換':'下降転換'});
    if(e[1]==='bo'&&document.getElementById('optBo').checked)m.push({time:e[0],position:e[2]==='up'?'aboveBar':'belowBar',shape:'circle',color:css('--accent'),text:''});
  }
  m.sort((a,b)=>a.time-b.time);cs.setMarkers(m);
  const n=d.candles.length;chart.timeScale().setVisibleLogicalRange({from:n-260,to:n+5});
  const last=d.prot[n-1];
  const pl=d.pprot[n-1],jp=x=>x==='up'?'上昇':'下降';
  document.getElementById('state').innerHTML=(last[2]?`最新足 主要 <b class="${last[2]}">${jp(last[2])}</b> ${last[2]==='up'?'押し安値':'戻り高値'} ${last[1]}`:'判定前')+(pl[2]?` ／ 仮 <b class="${pl[2]}">${jp(pl[2])}</b> ${pl[1]}`:'');
  const all=d.ev.filter(e=>e[1]!=='bo').concat(
    d.pev.map(e=>[e[0],'prov',e[1],e[2],e[0]]),
    d.wev.map(w=>[w[0],w[1],w[1]==='W_TOP'?'down':'up',w[3],w[5]])).sort((a,b)=>a[0]-b[0]);
  const rows=all.slice().reverse().map(e=>{
    const cls=e[2]==='up'?'up':e[2]==='down'?'down':'';
    const txt=e[1]==='prov'?`仮トレンド → ${e[2]==='up'?'上昇':'下降'}`:e[1]==='W_TOP'?'Wトップ（ネック割れ）':e[1]==='W_BOTTOM'?'Wボトム（ネック抜け）':e[1]==='rev'?`${NAMES.rev} → ${e[2]==='up'?'上昇':'下降'}（${e[3]} を終値で抜け）`:NAMES[e[1]]||e[1];
    return `<tr data-t="${e[0]}"><td>${fmt(e[0])}</td><td class="${cls}">${txt}</td><td>${e[3]}</td><td>${fmt(e[4])}</td></tr>`}).join('');
  document.getElementById('log').innerHTML=rows;
}
function jump(t){const d=DATA[tf].candles;let i=d.findIndex(c=>c[0]>=t);if(i<0)i=d.length-1;
  chart.timeScale().setVisibleLogicalRange({from:i-120,to:i+60});}
document.getElementById('log').addEventListener('click',ev=>{const r=ev.target.closest('tr[data-t]');if(r)jump(+r.dataset.t)});
const tfs=document.getElementById('tfs');
for(const x of TFS){const b=document.createElement('button');b.id='tf'+x;b.textContent=x;b.setAttribute('aria-pressed',x===tf);
  b.onclick=()=>{tf=x;try{localStorage.setItem('envtf',x)}catch(e){};for(const y of tfs.children)y.setAttribute('aria-pressed',y.textContent===x);build()};tfs.appendChild(b)}
for(const id of ['optPiv','optProt','optProv','optW','optBo'])document.getElementById(id).addEventListener('change',()=>{const r=chart.timeScale().getVisibleLogicalRange();build();if(r)chart.timeScale().setVisibleLogicalRange(r)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',build);
new MutationObserver(build).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
build();
</script>
