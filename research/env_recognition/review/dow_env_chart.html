td,th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr[data-t]{cursor:pointer} tr[data-t]:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}

    if(!q.time){el.textContent='';return}const b=q.seriesData.get(cs);
    el.textContent=b?`${fmt(q.time)}  始${b.open} 高${b.high} 安${b.low} 終${b.close}`:fmt(q.time)});
  cs=chart.addCandlestickSeries({upColor:'#ffffff00',borderUpColor:css('--fg'),wickUpColor:css('--fg'),
    downColor:css('--fg'),borderDownColor:css('--fg'),wickDownColor:css('--fg'),priceLineVisible:false});
  cs.setData(d.candles.map(c=>({time:c[0],open:c[1],high:c[2],low:c[3],close:c[4]})));
  ps=chart.addLineSeries({lineType:1,lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
  if(document.getElementById('optProt').checked)
    ps.setData(d.prot.map(p=>p[1]==null?{time:p[0]}:{time:p[0],value:p[1],color:p[2]==='up'?css('--prot-up'):css('--prot-down')}));
  const pv=chart.addLineSeries({lineType:1,lineWidth:2,lineStyle:2,color:css('--prov'),priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
  const showProv=document.getElementById('optProv').checked;
  if(showProv) pv.setData(d.pprot.map(p=>p[1]==null?{time:p[0]}:{time:p[0],value:p[1]}));
  if(document.getElementById('optSma').checked){
    chart.addLineSeries({color:css('--sma20'),lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(d.sma20.map(x=>({time:x[0],value:x[1]})));
    chart.addLineSeries({color:css('--sma75'),lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(d.sma75.map(x=>({time:x[0],value:x[1]})));
  }
  setupZones(el,d);
  const m=[];
  if(showProv) for(const e of d.pev) m.push({time:e[0],position:e[1]==='up'?'belowBar':'aboveBar',shape:'circle',color:css('--prov'),text:e[1]==='up'?'仮上昇':'仮下降'});
  if(document.getElementById('optW').checked) for(const w of d.wev) m.push({time:w[0],position:w[1]==='W_TOP'?'aboveBar':'belowBar',shape:w[1]==='W_TOP'?'arrowDown':'arrowUp',color:css('--w'),text:w[1]==='W_TOP'?'Wトップ':'Wボトム'});
  if(document.getElementById('optPiv').checked) for(const p of d.piv)
    m.push({time:p[0],position:p[1]==='hi'?'aboveBar':'belowBar',shape:p[1]==='hi'?'arrowDown':'arrowUp',color:css('--piv'),text:p[3]});
  for(const e of d.ev){
    if(e[1]==='rev')m.push({time:e[0],position:e[2]==='up'?'belowBar':'aboveBar',shape:'square',color:e[2]==='up'?css('--up'):css('--down'),text:e[2]==='up'?'上昇転換':'下降転換'});
    if(e[1]==='bo'&&document.getElementById('optBo').checked)m.push({time:e[0],position:e[2]==='up'?'aboveBar':'belowBar',shape:'circle',color:css('--accent'),text:''});
  }
  m.sort((a,b)=>a.time-b.time);cs.setMarkers(m);
  const n=d.candles.length;chart.timeScale().setVisibleLogicalRange({from:n-260,to:n+5});
  const last=d.prot[n-1];
  const pl=d.pprot[n-1],jp=x=>x==='up'?'上昇':'下降';
  document.getElementById('state').innerHTML=(last[2]?`最新足 主要 <b class="${last[2]}">${jp(last[2])}</b> ${last[2]==='up'?'押し安値':'戻り高値'} ${last[1]}`:'判定前')+(pl[2]?` ／ 仮 <b class="${pl[2]}">${jp(pl[2])}</b> ${pl[1]}`:'');
  const all=d.ev.filter(e=>e[1]!=='bo').concat(
    d.pev.map(e=>[e[0],'prov',e[1],e[2],e[0]]),
    d.wev.map(w=>[w[0],w[1],w[1]==='W_TOP'?'down':'up',w[3],w[5]])).sort((a,b)=>a[0]-b[0]);
  const rows=all.slice().reverse().map(e=>{
    const cls=e[2]==='up'?'up':e[2]==='down'?'down':'';
    const txt=e[1]==='prov'?`仮トレンド → ${e[2]==='up'?'上昇':'下降'}`:e[1]==='W_TOP'?'Wトップ（ネック割れ）':e[1]==='W_BOTTOM'?'Wボトム（ネック抜け）':e[1]==='rev'?`${NAMES.rev} → ${e[2]==='up'?'上昇':'下降'}（${e[3]} を終値で抜け）`:NAMES[e[1]]||e[1];
    return `<tr data-t="${e[0]}"><td>${fmt(e[0])}</td><td class="${cls}">${txt}</td><td>${e[3]}</td><td>${fmt(e[4])}</td></tr>`}).join('');
  document.getElementById('log').innerHTML=rows;
}
let zc=null,zraf=0;
function idxOf(d,t){if(t==null)return d.candles.length+3;let lo=0,hi=d.candles.length-1;
  if(t<=d.candles[0][0])return -0.5;while(lo<hi){const m=(lo+hi)>>1;if(d.candles[m][0]<t)lo=m+1;else hi=m}return lo}
function setupZones(el,d){
  cancelAnimationFrame(zraf);zc=document.createElement('canvas');
  zc.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:3';el.appendChild(zc);
  const zs=d.zones.map(z=>({a:idxOf(d,z[0]),v:idxOf(d,z[1]),e:idxOf(d,z[2]),lo:z[3],hi:z[4],lab:z[5]}));
  const draw=()=>{zraf=requestAnimationFrame(draw);
    const on=document.getElementById('optZone').checked,r=el.getBoundingClientRect(),dpr=devicePixelRatio||1;
    if(zc.width!==Math.round(r.width*dpr)||zc.height!==Math.round(r.height*dpr)){zc.width=Math.round(r.width*dpr);zc.height=Math.round(r.height*dpr);zc.style.width=r.width+'px';zc.style.height=r.height+'px'}
    const g=zc.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,r.width,r.height);if(!on)return;
    const ts=chart.timeScale(),W=ts.width(),fill=css('--zone'),edge=css('--zone-edge'),fg=css('--muted');
    g.save();g.beginPath();g.rect(0,0,W,r.height);g.clip();g.font='11px '+css('--mono');
    for(const z of zs){const x0=ts.logicalToCoordinate(z.a),xv=ts.logicalToCoordinate(z.v),x1=ts.logicalToCoordinate(z.e);
      const y0=cs.priceToCoordinate(z.hi),y1=cs.priceToCoordinate(z.lo);if([x0,xv,x1,y0,y1].some(v=>v==null))continue;
      const h=Math.max(2,y1-y0);
      g.setLineDash([3,3]);g.strokeStyle=edge;g.strokeRect(x0,y0,xv-x0,h);g.setLineDash([]);
      g.fillStyle=fill;g.fillRect(xv,y0,x1-xv,h);g.strokeStyle=edge;g.strokeRect(xv,y0,x1-xv,h);
      if(x1-xv>60){g.fillStyle=fg;g.fillText(z.lab,xv+4,y0-3)}}
    g.restore()};
  draw();
}
function jump(t){const d=DATA[tf].candles;let i=d.findIndex(c=>c[0]>=t);if(i<0)i=d.length-1;
  chart.timeScale().setVisibleLogicalRange({from:i-120,to:i+60});}
document.getElementById('log').addEventListener('click',ev=>{const r=ev.target.closest('tr[data-t]');if(r)jump(+r.dataset.t)});
const tfs=document.getElementById('tfs');
for(const x of TFS){const b=document.createElement('button');b.id='tf'+x;b.textContent=x;b.setAttribute('aria-pressed',x===tf);
  b.onclick=()=>{tf=x;try{localStorage.setItem('envtf',x)}catch(e){};for(const y of tfs.children)y.setAttribute('aria-pressed',y.textContent===x);build()};tfs.appendChild(b)}
for(const id of ['optPiv','optProt','optProv','optW','optSma','optBo'])document.getElementById(id).addEventListener('change',()=>{const r=chart.timeScale().getVisibleLogicalRange();build();if(r)chart.timeScale().setVisibleLogicalRange(r)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',build);
new MutationObserver(build).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
build();
</script>
