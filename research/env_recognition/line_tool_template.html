<title>トレンドライン手書き</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: toolbar, full-width chart, line list. Chart-desk look shared with the review chart. */
:root{
  --bg:#f6f7f9;--panel:#ffffff;--fg:#1b2230;--muted:#667085;--line:#d9dee7;
  --accent:#2457c5;--up:#1f8a4c;--down:#c8372d;--sel:#d97706;--piv-hi:#c8372d;--piv-lo:#1f8a4c;
  --sma20:#0284c7;--sma75:#b45309;--warn-bg:#fff4e5;--warn-fg:#8a4b00;
  --font:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151c;--panel:#171c25;--fg:#e4e8ef;--muted:#8b95a7;--line:#2a3140;
  --accent:#6c9cff;--up:#3fbf75;--down:#ef5b4f;--sel:#f2a33a;--piv-hi:#ef5b4f;--piv-lo:#3fbf75;
  --sma20:#38bdf8;--sma75:#f59e0b;--warn-bg:#3a2a12;--warn-fg:#ffcf8a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c;--panel:#171c25;--fg:#e4e8ef;--muted:#8b95a7;--line:#2a3140;
  --accent:#6c9cff;--up:#3fbf75;--down:#ef5b4f;--sel:#f2a33a;--piv-hi:#ef5b4f;--piv-lo:#3fbf75;
  --sma20:#38bdf8;--sma75:#f59e0b;--warn-bg:#3a2a12;--warn-fg:#ffcf8a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
h1{font-size:16px;margin:0;font-weight:600}
.tfs{display:flex;gap:4px}
button{font:600 13px var(--font);padding:6px 11px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;cursor:pointer}
.tfs button{font-family:var(--mono)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
button.draw[aria-pressed="true"]{background:var(--sel);border-color:var(--sel)}
button:disabled{opacity:.45;cursor:default}
label{font-size:13px;color:var(--muted);display:flex;gap:4px;align-items:center;cursor:pointer}
.status{font-size:12px;color:var(--muted);min-height:18px;margin-bottom:4px;font-family:var(--mono)}
.warn{background:var(--warn-bg);color:var(--warn-fg);padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:8px}
#chart{position:relative;height:min(68vh,640px);min-height:360px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
#chart.drawing{cursor:crosshair}
.help{font-size:12px;color:var(--muted);margin:8px 0 14px;line-height:1.7}
h2{font-size:14px;margin:0 0 6px}
.log{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font:12px var(--mono);font-variant-numeric:tabular-nums}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr[data-id]{cursor:pointer} tr.selrow{background:color-mix(in srgb,var(--sel) 18%,transparent)}
td button{padding:2px 8px;font-size:12px}
.up{color:var(--up)} .down{color:var(--down)}
textarea{width:100%;box-sizing:border-box;height:90px;font:11px var(--mono);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="bar">
  <h1>トレンドライン手書き</h1>
  <div class="tfs" id="tfs"></div>
  <button class="draw" id="btnDraw" aria-pressed="false">線を引く (L)</button>
  <button id="btnDel" disabled>選択した線を削除</button>
  <label><input type="checkbox" id="optSnap" checked> ヒゲ先に吸着</label>
  <label><input type="checkbox" id="optPiv" checked> エンジンの高値安値</label>
  <label><input type="checkbox" id="optSma" checked> SMA20/75</label>
</div>
<div class="warn" id="warn" hidden></div>
<div class="status" id="status">保存先に接続中…</div>
<div id="chart"></div>
<div class="help">
  「線を引く」を押してから、チャート上で1点目→2点目の順にクリックすると線が保存されます（Escで取り消し）。
  吸着ONならクリックした足の高値か安値（近い方）にぴったり合わせます。線をクリックで選択、Deleteキーか削除ボタンで消去。
  線は2点目より右へ点線で延長表示します。どの時間足で引いたかも一緒に保存されます。
</div>
<h2 id="listTitle">この時間足の線</h2>
<div class="log"><table><thead><tr><th>1点目</th><th>価格</th><th>2点目</th><th>価格</th><th>向き</th><th></th></tr></thead><tbody id="list"></tbody></table></div>
<div id="exportBox" hidden>
  <h2 style="margin-top:14px">バックアップ（保存先に接続できないときは、この内容をチャットに貼ってください）</h2>
  <textarea id="exportText" readonly></textarea>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const DATA=/*DATA*/null;
const TFS=['W1','D1','H4','H1','M15'];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const intraday=()=>tf!=='D1'&&tf!=='W1';
const fmt=t=>{const s=new Date(t*1000).toISOString();return s.slice(0,10).replaceAll('-','/')+(intraday()?' '+s.slice(11,16):'')};
let tf='H4',chart,cs,canvas,raf=0,drawing=false,pA=null,hover=null,selId=null;
let lines=[];            // {id,tf,t1,p1,t2,p2,dir,savedAt}
let col=null;            // db collection or null (local mode)
try{const s=localStorage.getItem('ltool_tf');if(TFS.includes(s))tf=s}catch(e){}
const $=id=>document.getElementById(id);

// ---------- storage ----------
function localLoad(){try{return JSON.parse(localStorage.getItem('ltool_lines')||'[]')}catch(e){return[]}}
function localSave(){try{localStorage.setItem('ltool_lines',JSON.stringify(lines))}catch(e){}}
function showExport(){$('exportBox').hidden=col!==null;$('exportText').value=JSON.stringify(lines)}
async function initStore(){
  let db=null;
  try{db=window.claude?.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){lines=localLoad();$('warn').hidden=false;
    $('warn').textContent='保存先（共有データベース）に接続できませんでした。線はこのブラウザだけに保存されます。下のバックアップをチャットに貼ってもらえれば読み取れます。';
    $('status').textContent='ローカル保存モード';refresh();showExport();return}
  col=db.collection('lines');
  col.onSnapshot(snap=>{lines=snap.docs.map(d=>({id:d.id,...d.data()}));$('status').textContent=`保存済みの線：全${lines.length}本`;refresh()},
    e=>{$('warn').hidden=false;$('warn').textContent='保存先との接続が切れました（'+(e.code||'')+'）。ページを開き直してください。'});
}
async function addLine(l){
  if(col){try{await col.add(l)}catch(e){$('warn').hidden=false;$('warn').textContent='保存できませんでした：'+(e.message||e.code)}}
  else{lines.push({id:'L'+Date.now(),...l});localSave();refresh();showExport()}
}
async function delLine(id){
  if(col){try{await col.doc(id).delete()}catch(e){$('warn').hidden=false;$('warn').textContent='削除できませんでした：'+(e.message||e.code)}}
  else{lines=lines.filter(x=>x.id!==id);localSave();refresh();showExport()}
  if(selId===id){selId=null;$('btnDel').disabled=true}
}

// ---------- chart ----------
const C=()=>DATA[tf].c;
function idxOf(t){const d=C();let lo=0,hi=d.length-1;if(t<=d[0][0])return 0;if(t>=d[hi][0])return hi;
  while(lo<hi){const m=(lo+hi)>>1;if(d[m][0]<t)lo=m+1;else hi=m}return lo}
function build(){
  const el=$('chart');cancelAnimationFrame(raf);el.innerHTML='';
  const d=DATA[tf];
  chart=LightweightCharts.createChart(el,{autoSize:true,
    layout:{background:{color:css('--panel')},textColor:css('--muted'),fontFamily:css('--mono')},
    grid:{vertLines:{color:css('--line')},horzLines:{color:css('--line')}},
    rightPriceScale:{borderColor:css('--line')},crosshair:{mode:0},
    localization:{locale:'ja-JP',timeFormatter:t=>fmt(t)},
    timeScale:{borderColor:css('--line'),timeVisible:intraday(),secondsVisible:false,
      tickMarkFormatter:(t,type)=>{const x=new Date(t*1000),p=v=>String(v).padStart(2,'0');
        return type===0?`${x.getUTCFullYear()}`:type===1?`${x.getUTCFullYear()}/${p(x.getUTCMonth()+1)}`:
          type===2?`${p(x.getUTCMonth()+1)}/${p(x.getUTCDate())}`:`${p(x.getUTCHours())}:${p(x.getUTCMinutes())}`}}});
  cs=chart.addCandlestickSeries({upColor:'#ffffff00',borderUpColor:css('--fg'),wickUpColor:css('--fg'),
    downColor:css('--fg'),borderDownColor:css('--fg'),wickDownColor:css('--fg'),priceLineVisible:false});
  cs.setData(d.c.map(c=>({time:c[0],open:c[1],high:c[2],low:c[3],close:c[4]})));
  if($('optSma').checked){
    chart.addLineSeries({color:css('--sma20'),lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(d.s20.map(x=>({time:x[0],value:x[1]})));
    chart.addLineSeries({color:css('--sma75'),lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(d.s75.map(x=>({time:x[0],value:x[1]})));}
  if($('optPiv').checked) for(const k of ['hi','lo']){
    const s=chart.addLineSeries({lineVisible:false,pointMarkersVisible:true,pointMarkersRadius:3,color:k==='hi'?css('--piv-hi'):css('--piv-lo'),
      priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
    s.setData(d.piv.filter(p=>p[1]===k).map(p=>({time:p[0],value:p[2]})));}
  const n=d.c.length;chart.timeScale().setVisibleLogicalRange({from:n-200,to:n+15});
  canvas=document.createElement('canvas');canvas.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:3';el.appendChild(canvas);
  chart.subscribeClick(onClick);
  chart.subscribeCrosshairMove(q=>{hover=q.point&&q.logical!=null?pick(q.logical,q.point.y):null;
    if(q.point&&q.logical!=null){const i=Math.max(0,Math.min(C().length-1,Math.round(q.logical)));const b=C()[i];
      $('status').textContent=`${fmt(b[0])}  始${b[1]} 高${b[2]} 安${b[3]} 終${b[4]}`+(drawing?(pA?'　→ 2点目をクリック':'　→ 1点目をクリック'):'')}});
  el.classList.toggle('drawing',drawing);
  loop();refresh();
}
function pick(logical,y){
  const i=Math.max(0,Math.min(C().length-1,Math.round(logical)));const b=C()[i];
  let p=cs.coordinateToPrice(y);if(p==null)return null;
  if($('optSnap').checked)p=Math.abs(p-b[2])<Math.abs(p-b[3])?b[2]:b[3];
  return {t:b[0],p:+(+p).toFixed(5)};
}
function xy(t,p){return [chart.timeScale().logicalToCoordinate(idxOf(t)),cs.priceToCoordinate(p)]}
function onClick(q){
  if(!q.point||q.logical==null)return;
  if(drawing){const pt=pick(q.logical,q.point.y);if(!pt)return;
    if(!pA){pA=pt;return}
    if(pt.t===pA.t){return}
    const [a,b]=pt.t<pA.t?[pt,pA]:[pA,pt];pA=null;
    addLine({tf,t1:a.t,p1:a.p,t2:b.t,p2:b.p,dir:b.p>=a.p?'up':'down',savedAt:new Date().toISOString()});return}
  // selection
  let best=null,bd=8;
  for(const l of lines.filter(x=>x.tf===tf)){const[x1,y1]=xy(l.t1,l.p1),[x2,y2]=xy(l.t2,l.p2);if([x1,y1,x2,y2].some(v=>v==null))continue;
    const W=chart.timeScale().width(),slope=(y2-y1)/((x2-x1)||1),xe=W,ye=y2+slope*(xe-x2);
    const dist=segDist(q.point.x,q.point.y,x1,y1,Math.max(xe,x2),Math.max(xe,x2)===x2?y2:ye);if(dist<bd){bd=dist;best=l.id}}
  selId=best;$('btnDel').disabled=!selId;refresh();
}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy||1;let u=((px-x1)*dx+(py-y1)*dy)/L;u=Math.max(0,Math.min(1,u));
  return Math.hypot(px-(x1+u*dx),py-(y1+u*dy))}
function loop(){raf=requestAnimationFrame(loop);
  const el=$('chart'),r=el.getBoundingClientRect(),dpr=devicePixelRatio||1;
  if(canvas.width!==Math.round(r.width*dpr)||canvas.height!==Math.round(r.height*dpr)){canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px'}
  const g=canvas.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,r.width,r.height);
  const W=chart.timeScale().width();g.save();g.beginPath();g.rect(0,0,W,r.height);g.clip();
  const seg=(a,b,col,w,dash,extend)=>{const[x1,y1]=xy(a.t,a.p),[x2,y2]=xy(b.t,b.p);if([x1,y1,x2,y2].some(v=>v==null))return;
    g.strokeStyle=col;g.lineWidth=w;g.setLineDash([]);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
    if(extend&&x2>x1){const s=(y2-y1)/(x2-x1);g.setLineDash([5,4]);g.beginPath();g.moveTo(x2,y2);g.lineTo(W,y2+s*(W-x2));g.stroke()}
    g.setLineDash([]);g.fillStyle=col;for(const[x,y]of[[x1,y1],[x2,y2]]){g.beginPath();g.arc(x,y,3,0,7);g.fill()}};
  for(const l of lines.filter(x=>x.tf===tf)){const sel=l.id===selId;
    seg({t:l.t1,p:l.p1},{t:l.t2,p:l.p2},sel?css('--sel'):(l.dir==='up'?css('--up'):css('--down')),sel?3:2,false,true)}
  if(drawing&&pA&&hover)seg(pA,hover,css('--sel'),1.5,false,false);
  if(drawing&&pA){const[x,y]=xy(pA.t,pA.p);if(x!=null&&y!=null){g.strokeStyle=css('--sel');g.lineWidth=2;g.beginPath();g.arc(x,y,6,0,7);g.stroke()}}
  g.restore()}
function refresh(){
  for(const b of $('tfs').children){const k=b.dataset.tf;const n=lines.filter(x=>x.tf===k).length;b.textContent=k+(n?` (${n})`:'');b.setAttribute('aria-pressed',k===tf)}
  const rows=lines.filter(x=>x.tf===tf).sort((a,b)=>b.t2-a.t2);
  $('listTitle').textContent=`${tf} の線（${rows.length}本）`;
  $('list').innerHTML=rows.length?rows.map(l=>`<tr data-id="${l.id}" class="${l.id===selId?'selrow':''}"><td>${fmt(l.t1)}</td><td>${l.p1}</td><td>${fmt(l.t2)}</td><td>${l.p2}</td>
    <td class="${l.dir}">${l.dir==='up'?'上昇':'下降'}</td><td><button data-del="${l.id}">削除</button></td></tr>`).join('')
    :'<tr><td colspan="6">まだ線がありません。「線を引く」を押して2点をクリックしてください。</td></tr>';
}
$('list').addEventListener('click',ev=>{const del=ev.target.closest('button[data-del]');if(del){delLine(del.dataset.del);return}
  const r=ev.target.closest('tr[data-id]');if(!r)return;const l=lines.find(x=>x.id===r.dataset.id);if(!l)return;
  selId=l.id;$('btnDel').disabled=false;const a=idxOf(l.t1),b=idxOf(l.t2);chart.timeScale().setVisibleLogicalRange({from:a-30,to:b+60});refresh()});
function setDraw(v){drawing=v;pA=null;$('btnDraw').setAttribute('aria-pressed',v);$('chart').classList.toggle('drawing',v)}
$('btnDraw').onclick=()=>setDraw(!drawing);
$('btnDel').onclick=()=>{if(selId)delLine(selId)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;
  if(e.key==='Escape'){if(pA)pA=null;else setDraw(false)}
  if(e.key==='l'||e.key==='L')setDraw(!drawing);
  if((e.key==='Delete'||e.key==='Backspace')&&selId){e.preventDefault();delLine(selId)}});
for(const x of TFS){const b=document.createElement('button');b.dataset.tf=x;b.textContent=x;b.id='tf'+x;
  b.onclick=()=>{tf=x;selId=null;$('btnDel').disabled=true;pA=null;try{localStorage.setItem('ltool_tf',x)}catch(e){};build()};$('tfs').appendChild(b)}
for(const id of ['optPiv','optSma'])$(id).addEventListener('change',()=>{const r=chart.timeScale().getVisibleLogicalRange();build();if(r)chart.timeScale().setVisibleLogicalRange(r)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',build);
new MutationObserver(build).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
build();initStore();
</script>
