<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EURUSD Trendline Lab — as-of</title><style>body{background:#0b1220;color:#e5ecf5;font:14px system-ui;margin:0}header{padding:16px 22px;border-bottom:1px solid #28364a}h2{margin:0 0 5px;font-size:18px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:12px 20px;align-items:center}select,input,button{background:#1b293c;color:white;border:1px solid #40516b;border-radius:6px;padding:7px}button{cursor:pointer}.wrap{padding:0 16px 16px}canvas{width:100%;height:600px;background:#101b2b;border:1px solid #28364a;border-radius:8px}.muted{color:#a9b9cf}.legend{display:flex;gap:18px;padding:8px 20px}.sw{display:inline-block;width:22px;height:3px;vertical-align:middle;margin-right:6px}</style></head><body><header><h2>Trendline Lab — causal as-of</h2><div class="muted">Dow pivot confirmed → 2-point / 3-point trendlines → break / trend reversal retirement</div></header><div class="toolbar"><label>MT5 CSV <input type="file" id="file" accept=".csv,.txt"></label><label>時間足 <select id="tf"><option>M15</option><option>H1</option><option selected>H4</option><option>D1</option><option>W1</option></select></label><label>実行時刻（確定足） <input type="datetime-local" id="asof"></label><label>表示本数 <select id="window"><option>150</option><option selected>300</option><option>600</option><option>1000</option></select></label><button id="run">再計算</button><span id="status" class="muted">CSVを選択してください（M15/M5のMT5形式）</span></div><div class="legend"><span><i class="sw" style="background:#38bdf8"></i>2点サポート</span><span><i class="sw" style="background:#f59e0b"></i>2点レジスタンス</span><span><i class="sw" style="background:#22c55e"></i>3点サポート</span><span><i class="sw" style="background:#e879f9"></i>3点レジスタンス</span></div><div class="wrap"><canvas id="chart"></canvas><p id="detail" class="muted"></p></div><script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('chart'),ctx=canvas.getContext('2d');
let raw=[],series=[],lines=[];
const PARAMS={W1:[1.9,.15,.4],D1:[1.9,-.15,.4],H4:[2,.30,.4],H1:[2.4,-.15,.25],M15:[2.1,.30,.25]};
const MAXGAP={W1:75,D1:95,H4:115,H1:145,M15:175},SUPPRESS={W1:45,D1:65,H4:85,H1:110,M15:130};
function parse(text){let arr=[];for(let row of text.split(/\r?\n/)){if(!row.trim())continue;let v=row.trim().split(/[\t,;]+/);if(v[0].startsWith('<')||v[0].toLowerCase().includes('date'))continue;let t=Date.parse(v[0].replace(/\./g,'-')+'T'+(v[1]||'00:00')+'Z');let k=2;if(!Number.isFinite(t)){t=Date.parse(v[0].replace(' ','T')+'Z');k=1}if(!Number.isFinite(t))continue;let o=+v[k],h=+v[k+1],l=+v[k+2],c=+v[k+3];if([o,h,l,c].every(Number.isFinite)&&h>=l)arr.push({t,o,h,l,c})}arr.sort((a,b)=>a.t-b.t);return arr.filter((v,i)=>!i||v.t!==arr[i-1].t)}
function aggregate(a,tf){let ms={M15:9e5,H1:36e5,H4:144e5,D1:864e5,W1:6048e5}[tf],map=new Map();for(let v of a){let t=tf==='W1'?Math.floor((v.t+2592e5)/ms)*ms-2592e5:Math.floor(v.t/ms)*ms;let p=map.get(t);if(!p)map.set(t,{...v,t});else{p.h=Math.max(p.h,v.h);p.l=Math.min(p.l,v.l);p.c=v.c}}return [...map.values()]}
function indicators(a,tf){let [k,boost,cut]=PARAMS[tf],atr=[],er=[],noise=[],s=0;for(let i=0;i<a.length;i++){let v=a[i],pc=i?a[i-1].c:v.c,tr=Math.max(v.h-v.l,Math.abs(v.h-pc),Math.abs(v.l-pc));s=i?s+(tr-s)/7:tr;atr.push(s);let n=0;for(let j=Math.max(1,i-19);j<=i;j++)n+=Math.abs(a[j].c-a[j-1].c);noise.push(n);er.push(i>=20?Math.abs(v.c-a[i-20].c)/Math.max(n,1e-12):0)}return {atr,th:atr.map((v,i)=>k*v*(er[i]>=cut?1+boost:1))}}
function pivots(a,th){let out=[],dir=0,ei=60,ep=a[60]?.c,last=-1;for(let i=61;i<a.length;i++){let v=a[i];if(!dir){if(v.h>a[60].c+th[i]){dir=1;ei=i;ep=v.h}else if(v.l<a[60].c-th[i]){dir=-1;ei=i;ep=v.l}continue}if(dir===1){if(v.h>=ep){ep=v.h;ei=i}if(i>ei&&ep-v.l>=th[i]&&ei>last){out.push({id:out.length,kind:'hi',idx:ei,at:i});last=ei;dir=-1;ei=i;ep=v.l}}else{if(v.l<=ep){ep=v.l;ei=i}if(i>ei&&v.h-ep>=th[i]&&ei>last){out.push({id:out.length,kind:'lo',idx:ei,at:i});last=ei;dir=1;ei=i;ep=v.h}}}return out}
function reanchor(a,b,p,kind){let sign=kind==='lo'?1:-1;for(let iter=0;iter<b-a;iter++){let best=0,at=-1;for(let i=a+1;i<b;i++){let y=p[a]+(p[b]-p[a])*(i-a)/(b-a),intr=sign*(y-p[i]);if(intr>best+1e-10){best=intr;at=i}}if(at<0)break;a=at}return a}
function build(a,tf){if(a.length<70)return [];let {atr,th}=indicators(a,tf),ev=pivots(a,th),p={lo:a.map(x=>x.l),hi:a.map(x=>x.h)},c=a.map(x=>x.c),all=[];for(let j=0;j<ev.length;j++){let q=ev[j],kind=q.kind,group=ev.slice(0,j+1).filter(x=>x.kind===kind),sign=kind==='lo'?1:-1;if(group.length>=2){let x=group.at(-2),y=group.at(-1),u=x.idx,v=y.idx;if(v-u>=15&&sign*(p[kind][v]-p[kind][u])>0){let anchor=reanchor(u,v,p[kind],kind);all.push({type:'two',kind,a:anchor,b:v,pa:p[kind][anchor],pb:p[kind][v],at:q.at})}}if(group.length>=3){let [x,m,y]=group.slice(-3),u=x.idx,v=y.idx,z=m.idx,gap=MAXGAP[tf];if(z-u>=4&&v-z>=4&&z-u<=gap&&v-z<=gap&&sign*(p[kind][z]-p[kind][u])>=.12*atr[z]&&sign*(p[kind][v]-p[kind][z])>=.12*atr[v]){let slope=(p[kind][v]-p[kind][u])/(v-u),bad=0,mx=0;for(let t=u;t<=v;t++){let ln=p[kind][u]+slope*(t-u),intr=(kind==='lo'?ln-c[t]:c[t]-ln)/Math.max(atr[t],1e-8);if(intr>.35)bad++;mx=Math.max(mx,intr)}let err=Math.abs(p[kind][z]-(p[kind][u]+slope*(z-u)))/Math.max(atr[z],1e-8),norm=Math.abs(p[kind][v]-p[kind][u])/(atr.slice(u,v+1).sort((x,y)=>x-y)[Math.floor((v-u)/2)]||1);if(bad/(v-u+1)<=.1&&mx<=1.7&&err<=.85&&norm>=.25&&norm<=7){let score=2*bad/(v-u+1)+.4*err+.1*Math.max(0,norm-3);let near=all.filter(z=>z.type==='three'&&z.kind===kind&&Math.abs(z.b-v)<=SUPPRESS[tf]);if(!near.length||score<Math.min(...near.map(z=>z.score))-.12){for(let z of near)z.supersededAt=q.at;all.push({type:'three',kind,a:u,b:v,pa:p[kind][u],pb:p[kind][v],at:q.at,score})}}}}}
 // Structural reversal is derived from confirmed pivots; a break of the most recent protected low/high retires lines of the prior trend.
 let current=null,protectedLevel=null;for(let i=0;i<a.length;i++){let available=ev.filter(z=>z.at===i);for(let z of available){let lows=ev.filter(e=>e.kind==='lo'&&e.at<=i),highs=ev.filter(e=>e.kind==='hi'&&e.at<=i);if(lows.length>=2&&highs.length>=2){let up=lows.at(-1).idx>lows.at(-2).idx&&a[lows.at(-1).idx].l>a[lows.at(-2).idx].l&&a[highs.at(-1).idx].h>a[highs.at(-2).idx].h;let dn=a[lows.at(-1).idx].l<a[lows.at(-2).idx].l&&a[highs.at(-1).idx].h<a[highs.at(-2).idx].h;if(up){current='up';protectedLevel=a[lows.at(-1).idx].l}else if(dn){current='down';protectedLevel=a[highs.at(-1).idx].h}}}
 for(let l of all){if(l.retiredAt!==undefined||l.at>i)continue;let y=l.pa+(l.pb-l.pa)*(i-l.a)/(l.b-l.a);if(i>l.at&&((l.kind==='lo'&&a[i].c<y)||(l.kind==='hi'&&a[i].c>y)))l.brokenAt??=i;
 if(l.brokenAt!==undefined){let pp=ev.filter(z=>z.at<=i&&z.at>l.brokenAt&&z.kind===(l.kind==='lo'?'hi':'lo'));if(pp.length>=3){let v=pp.slice(-3).map(z=>l.kind==='lo'?a[z.idx].h:a[z.idx].l);if(l.kind==='lo'?(v[0]>v[1]&&v[1]>v[2]):(v[0]<v[1]&&v[1]<v[2]))l.retiredAt=i}}
 // The trend flip retirement is evaluated from confirmed Dow structure, not from the visual line touch.
 if(current==='down'&&l.kind==='lo'&&l.brokenAt!==undefined)l.retiredAt??=i;
 if(current==='up'&&l.kind==='hi'&&l.brokenAt!==undefined)l.retiredAt??=i;
 }}return all}
function draw(){if(!series.length)return;let t=$('asof').value?Date.parse($('asof').value+'Z'):Infinity,end=series.findLastIndex(x=>x.t<=t);if(end<0)return;let count=+$('window').value,start=Math.max(0,end-count+1),vis=series.slice(start,end+1),w=canvas.width=canvas.clientWidth*devicePixelRatio,h=canvas.height=600*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w/=devicePixelRatio;h/=devicePixelRatio;ctx.clearRect(0,0,w,h);let left=60,right=w-18,top=25,bottom=h-40,low=Math.min(...vis.map(x=>x.l)),high=Math.max(...vis.map(x=>x.h)),pad=(high-low)*.06||.001;low-=pad;high+=pad;let X=i=>left+(i-start+.5)*(right-left)/vis.length,Y=v=>bottom-(v-low)*(bottom-top)/(high-low);ctx.font='11px system-ui';ctx.strokeStyle='#25364a';ctx.fillStyle='#a9b9cf';for(let k=0;k<=6;k++){let y=top+(bottom-top)*k/6;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();ctx.fillText((high-(high-low)*k/6).toFixed(5),4,y+3)}for(let i=start;i<=end;i++){let z=series[i],x=X(i),up=z.c>=z.o;ctx.strokeStyle=up?'#23b7a4':'#e36b72';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(x,Y(z.h));ctx.lineTo(x,Y(z.l));ctx.stroke();ctx.fillRect(x-Math.max(1,(right-left)/vis.length*.29),Math.min(Y(z.o),Y(z.c)),Math.max(2,(right-left)/vis.length*.58),Math.max(1,Math.abs(Y(z.o)-Y(z.c))))}let active=lines.filter(l=>l.at<=end&&(l.retiredAt===undefined||l.retiredAt>end)&&(l.supersededAt===undefined||l.supersededAt>end));for(let l of active){let y0=l.pa+(l.pb-l.pa)*(Math.max(start,l.at)-l.a)/(l.b-l.a),y1=l.pa+(l.pb-l.pa)*(end-l.a)/(l.b-l.a);ctx.strokeStyle=l.type==='two'?(l.kind==='lo'?'#38bdf8':'#f59e0b'):(l.kind==='lo'?'#22c55e':'#e879f9');ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(X(Math.max(start,l.at)),Y(y0));ctx.lineTo(X(end),Y(y1));ctx.stroke()}ctx.fillStyle='#b6c8da';for(let k=0;k<6;k++){let i=Math.min(end,start+Math.round((vis.length-1)*k/5));ctx.fillText(new Date(series[i].t).toISOString().slice(0,16).replace('T',' '),Math.min(w-120,X(i)),h-16)}$('detail').textContent='表示時点: '+new Date(series[end].t).toISOString().slice(0,16)+' UTC | 表示中 '+active.length+' 本（2点 '+active.filter(x=>x.type==='two').length+' / 3点 '+active.filter(x=>x.type==='three').length+'） | 計算済み '+lines.length+' 本'}
function run(){if(!raw.length)return;let tf=$('tf').value;series=aggregate(raw,tf);$('status').textContent='計算中…';setTimeout(()=>{lines=build(series,tf);$('status').textContent=series.length.toLocaleString()+'本 / '+lines.length+'ライン生成';if(!$('asof').value&&series.length)$('asof').value=new Date(series.at(-1).t).toISOString().slice(0,16);draw()},10)}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;$('status').textContent='読み込み中…';raw=parse(await f.text());$('asof').value='';run()};$('run').onclick=run;$('asof').onchange=draw;$('window').onchange=draw;$('tf').onchange=()=>{$('asof').value='';run()};window.onresize=draw;
</script></body></html>
