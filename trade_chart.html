<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>トレードのチャート</title>
<!-- 2026-11-27 (user): a recorded trade as a live chart instead of saved images, to correct the trendlines / 抵抗帯 on it.
     Opened from the trade detail (app.js openTradeChart, in a full-screen frame) as trade_chart.html#<EntryID>.
     Data: the PC makes it once an hour (mt5_ea/live/trade_images.chart_data -> GAS eaTradeChart -> a private Drive file);
     read with eaChartGet, the lines are saved with eaChartLines (Entries 'ChartLines', JSON; the same line format as the report).
     The drawing code is the report's (mt5_ea/live/report_template.html) for one trade. -->
<style>
:root{--bg:#0b1220;--card:#111c31;--line:#1e293b;--line2:#334155;--fg:#e2e8f0;--mut:#94a3b8;--dim:#64748b;--up:#4ade80;--dn:#f87171}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 6px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(10px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}.top b{font-size:15px}.top .x{margin-left:auto}
button.t{background:#172033;color:var(--fg);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;touch-action:manipulation}
button.t.on{background:#0e7490;border-color:#22d3ee}button.t:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}.info{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut)}
.up{color:var(--up)}.dn{color:var(--dn)}canvas{width:100%;display:block;background:#0b1220;border:1px solid var(--line);border-radius:10px;touch-action:none}
.note{font-size:11px;color:var(--dim);line-height:1.6}#msg{font-size:12px;min-height:18px}
input.n{width:100%;background:#0f172a;color:var(--fg);border:1px solid var(--line2);border-radius:8px;padding:7px;font-size:14px}
.empty{padding:40px 10px;text-align:center;color:var(--mut);line-height:1.8}
</style></head><body>
